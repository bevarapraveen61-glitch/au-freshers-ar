<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AU Mathematics Freshers Party — AR Invitation</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui, sans-serif; background:#120b17; }
    #welcome { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; color:#fff; text-align:center; background:radial-gradient(circle at 50% 20%, #5b1740, #120b17 68%); }
    #welcome h1 { margin:0; font-size:clamp(25px,7vw,38px); }
    #welcome p { max-width:340px; line-height:1.5; margin:0; color:#f6dce9; }
    #start { border:0; border-radius:28px; padding:14px 25px; font-size:17px; font-weight:700; color:#5a1539; background:#ffb6d2; }
    #hint { position:fixed; z-index:4; bottom:20px; left:12px; right:12px; text-align:center; color:white; text-shadow:0 2px 5px #000; pointer-events:none; }
    #error { color:#ffd5df; font-size:13px; max-width:340px; }
  </style>
</head>
<body>
  <div id="welcome">
    <h1>🌸 Freshers Party AR 🌸</h1>
    <p>Bring your Mathematics Department invitation to life. Tap Start, allow camera access, then point your camera at the printed invitation.</p>
    <button id="start">Start AR experience</button>
    <div id="error"></div>
  </div>
  <div id="hint">Point your camera at the full invitation card</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- A little 3D flower garden grows out from the invitation -->
      <a-entity position="-0.30 0.20 0.05" scale="0.001 0.001 0.001" animation="property: scale; to: 0.23 0.23 0.23; dur: 1200; easing: easeOutElastic; startEvents: targetFound">
        <a-cylinder position="0 -0.34 0" radius="0.025" height="0.68" color="#368b43"></a-cylinder>
        <a-sphere position="0 -0.12 0.02" scale="0.23 0.08 0.06" color="#49a85a" rotation="0 0 -28"></a-sphere>
        <a-entity position="0 0.10 0">
          <a-sphere position="0 0 0" radius="0.13" color="#f7bd35"></a-sphere>
          <a-sphere position="0 0.20 0" scale="0.10 0.18 0.06" color="#ff70aa"></a-sphere>
          <a-sphere position="0.19 0.06 0" scale="0.10 0.18 0.06" rotation="0 0 72" color="#ff70aa"></a-sphere>
          <a-sphere position="0.12 -0.16 0" scale="0.10 0.18 0.06" rotation="0 0 145" color="#ff70aa"></a-sphere>
          <a-sphere position="-0.12 -0.16 0" scale="0.10 0.18 0.06" rotation="0 0 -145" color="#ff70aa"></a-sphere>
          <a-sphere position="-0.19 0.06 0" scale="0.10 0.18 0.06" rotation="0 0 -72" color="#ff70aa"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity position="0.31 0.18 0.08" scale="0.001 0.001 0.001" animation="property: scale; to: 0.20 0.20 0.20; dur: 1500; delay: 250; easing: easeOutElastic; startEvents: targetFound">
        <a-cylinder position="0 -0.38 0" radius="0.022" height="0.76" color="#368b43"></a-cylinder>
        <a-entity position="0 0.05 0">
          <a-sphere radius="0.12" color="#ffd54e"></a-sphere>
          <a-sphere position="0 0.18 0" scale="0.09 0.17 0.06" color="#fff4fa"></a-sphere>
          <a-sphere position="0.17 0.05 0" scale="0.09 0.17 0.06" rotation="0 0 72" color="#fff4fa"></a-sphere>
          <a-sphere position="0.10 -0.15 0" scale="0.09 0.17 0.06" rotation="0 0 144" color="#fff4fa"></a-sphere>
          <a-sphere position="-0.10 -0.15 0" scale="0.09 0.17 0.06" rotation="0 0 -144" color="#fff4fa"></a-sphere>
          <a-sphere position="-0.17 0.05 0" scale="0.09 0.17 0.06" rotation="0 0 -72" color="#fff4fa"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Floating petals -->
      <a-sphere position="-0.18 -0.18 0.16" scale="0.055 0.10 0.018" color="#ff5b9d" animation="property: position; to: -0.22 0.34 0.16; dur: 2600; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="0.12 -0.26 0.18" scale="0.05 0.09 0.018" color="#ffc1d8" animation="property: position; to: 0.22 0.30 0.18; dur: 3200; delay: 350; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="0.02 0.30 0.14" scale="0.045 0.08 0.018" color="#ff83b4" animation="property: position; to: -0.08 -0.30 0.14; dur: 2900; delay: 700; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="0.35 -0.08 0.15" scale="0.045 0.08 0.018" color="#fff0a8" animation="property: position; to: 0.25 0.36 0.15; dur: 3500; delay: 500; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>

      <!-- Sparkles -->
      <a-sphere position="-0.38 0.34 0.12" radius="0.025" color="#fff2a6" animation="property: scale; to: 1.8 1.8 1.8; dur: 800; loop: true; dir: alternate"></a-sphere>
      <a-sphere position="0.38 0.30 0.12" radius="0.02" color="#fff2a6" animation="property: scale; to: 2 2 2; dur: 1000; loop: true; dir: alternate"></a-sphere>
      <a-sphere position="-0.34 -0.30 0.12" radius="0.02" color="#fff2a6" animation="property: scale; to: 1.7 1.7 1.7; dur: 900; loop: true; dir: alternate"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    const startButton = document.getElementById('start');
    const welcome = document.getElementById('welcome');
    const errorBox = document.getElementById('error');
    const sceneEl = document.querySelector('a-scene');
    startButton.addEventListener('click', async () => {
      if (!window.isSecureContext && location.hostname !== 'localhost') {
        errorBox.textContent = 'Camera access needs a secure HTTPS website. Upload this folder to GitHub Pages or Netlify first.';
        return;
      }
      try {
        const arSystem = sceneEl.systems['mindar-image-system'];
        await arSystem.start();
        welcome.style.display = 'none';
      } catch (err) {
        errorBox.textContent = 'Could not start the camera. Allow camera permission and try Chrome over HTTPS. ' + (err.message || '');
      }
    });
  </script>
</body>
</html>
