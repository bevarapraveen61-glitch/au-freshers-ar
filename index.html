<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#160b2b">
  <title>AU Freshers AR Experience</title>
  <style>
    :root { color-scheme: dark; --gold:#f7d98b; --ink:#160b2b; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080611; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    #ar-container { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#080611; }
    /* MindAR creates a video and a WebGL canvas. Both must cover the SAME viewport. */
    #ar-container video, #ar-container canvas {
      position:absolute !important; inset:0 !important; width:100% !important; height:100% !important;
      object-fit:cover !important; transform:none !important;
    }
    #ar-container video { z-index:0 !important; }
    #ar-container canvas { z-index:1 !important; }
    #shade { position:fixed; inset:0; z-index:2; pointer-events:none;
      background:linear-gradient(180deg,rgba(10,5,22,.28),transparent 28%,transparent 72%,rgba(10,5,22,.5)); }
    #top { position:fixed; z-index:4; top:env(safe-area-inset-top,12px); left:0; right:0;
      padding:14px 16px; text-align:center; pointer-events:none; }
    #top h1 { margin:0; color:var(--gold); font-size:clamp(18px,5vw,25px); letter-spacing:.04em;
      text-shadow:0 2px 10px #000; }
    #status { display:inline-block; margin-top:7px; padding:6px 11px; border-radius:20px;
      color:#fff; background:rgba(15,8,28,.72); font-size:12px; }
    #panel { position:fixed; z-index:5; inset:0; display:flex; align-items:center; justify-content:center;
      padding:24px; background:radial-gradient(ellipse at center,#3b205b 0%,#160b2b 65%,#080611 100%); }
    #card { width:min(440px,100%); padding:26px 22px; border:1px solid rgba(247,217,139,.55);
      border-radius:22px; background:rgba(18,10,32,.92); text-align:center; box-shadow:0 18px 60px #0009; }
    #card h2 { color:var(--gold); margin:0 0 10px; font-size:25px; }
    #card p { color:#eee5f7; line-height:1.55; font-size:14px; }
    button { border:0; border-radius:999px; padding:14px 25px; margin-top:10px; color:#24152e;
      background:linear-gradient(135deg,#fff0bd,#e6b957); font-weight:750; font-size:16px; cursor:pointer; }
    #hint { color:#d9cde7; font-size:12px !important; margin-top:14px; }
    #stop { position:fixed; z-index:6; right:14px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
      padding:10px 16px; font-size:13px; display:none; }
    #error { color:#ffd1d1; white-space:pre-wrap; font-size:12px; margin-top:12px; }
    .spark { position:fixed; z-index:3; pointer-events:none; color:#ffe6a4; opacity:.75;
      animation:float 7s linear infinite; text-shadow:0 0 12px #ffd36b; }
    @keyframes float { from { transform:translateY(15vh) rotate(0); opacity:0 } 15%{opacity:.8}
      to { transform:translateY(-110vh) rotate(300deg); opacity:0 } }
  </style>
</head>
<body>
  <div id="ar-container" aria-label="Live camera view"></div>
  <div id="shade"></div>
  <header id="top">
    <h1>AU Freshers AR Experience</h1>
    <div id="status">Camera has not started</div>
  </header>

  <section id="panel">
    <div id="card">
      <h2>Welcome!</h2>
      <p>Start the camera, then point it at the printed invitation image to view the AR experience.</p>
      <button id="start" type="button">Start AR Experience</button>
      <p id="hint">Use HTTPS, allow camera permission, and use the rear camera when prompted.</p>
      <div id="error" role="alert"></div>
    </div>
  </section>
  <button id="stop" type="button">Stop camera</button>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";
    import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

    const container = document.querySelector("#ar-container");
    const panel = document.querySelector("#panel");
    const statusEl = document.querySelector("#status");
    const errorEl = document.querySelector("#error");
    const startBtn = document.querySelector("#start");
    const stopBtn = document.querySelector("#stop");
    let mindar = null;
    let started = false;

    function status(message) { statusEl.textContent = message; }
    function showError(message) {
      errorEl.textContent = message;
      status("Camera / AR could not start");
      panel.style.display = "flex";
      startBtn.disabled = false;
      startBtn.textContent = "Try again";
    }

    async function startAR() {
      if (started) return;
      startBtn.disabled = true;
      startBtn.textContent = "Starting camera…";
      errorEl.textContent = "";
      status("Requesting camera permission…");

      if (!window.isSecureContext) {
        showError("Camera access requires HTTPS. Open this website using its https:// GitHub Pages address.");
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        showError("This browser does not support camera access. Try the latest Chrome browser.");
        return;
      }

      try {
        mindar = new MindARThree({
          container,
          imageTargetSrc: "./targets.mind",
          maxTrack: 1,
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no"
        });

        const { renderer, scene, camera } = mindar;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const anchor = mindar.addAnchor(0);
        const group = new THREE.Group();
        anchor.group.add(group);

        // Display the invitation image when the target in targets.mind is recognised.
        const invitationTexture = await new THREE.TextureLoader().loadAsync("./freshers-invitation.png");
        invitationTexture.colorSpace = THREE.SRGBColorSpace;
        const image = new THREE.Mesh(
          new THREE.PlaneGeometry(1, 1),
          new THREE.MeshBasicMaterial({ map: invitationTexture, transparent: true, side: THREE.DoubleSide })
        );
        image.scale.set(1, 1, 1);
        image.position.set(0, 0, 0.01);
        group.add(image);

        // A subtle decorative ring gives a visible AR response without blocking the camera.
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.53, 0.56, 64),
          new THREE.MeshBasicMaterial({ color: 0xf7d98b, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
        );
        ring.position.z = 0.015;
        group.add(ring);

        anchor.onTargetFound = () => status("Invitation detected — AR is active");
        anchor.onTargetLost = () => status("Point the camera at the invitation");

        status("Starting camera…");
        await mindar.start();
        started = true;
        panel.style.display = "none";
        stopBtn.style.display = "block";
        status("Point the camera at the invitation");

        renderer.setAnimationLoop(() => {
          ring.rotation.z += 0.003;
          renderer.render(scene, camera);
        });

        // Keep the camera and canvas aligned to the viewport after rotation/resizing.
        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", () => setTimeout(resize, 250));
      } catch (err) {
        console.error(err);
        if (mindar) {
          try { await mindar.stop(); } catch (_) {}
          mindar = null;
        }
        container.replaceChildren();
        started = false;
        let message = err?.message || String(err);
        if (err?.name === "NotAllowedError") message = "Camera permission was denied. Allow camera access in Chrome site settings, then try again.";
        else if (err?.name === "NotFoundError") message = "No camera was found on this device.";
        else if (err?.name === "NotReadableError") message = "The camera may be in use by another app. Close other camera apps and try again.";
        else if (message.includes("targets.mind")) message = "Could not load targets.mind. Check that targets.mind is uploaded beside index.html in your GitHub repository.";
        else if (message.includes("freshers-invitation")) message = "Could not load freshers-invitation.png. Check the exact filename and upload it beside index.html.";
        showError(message);
      }
    }

    function resize() {
      if (!mindar) return;
      const renderer = mindar.renderer;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    async function stopAR() {
      if (!mindar) return;
      try {
        mindar.renderer.setAnimationLoop(null);
        await mindar.stop();
      } catch (err) { console.warn(err); }
      mindar = null;
      started = false;
      container.replaceChildren();
      stopBtn.style.display = "none";
      panel.style.display = "flex";
      startBtn.disabled = false;
      startBtn.textContent = "Start AR Experience";
      status("Camera stopped");
    }

    startBtn.addEventListener("click", startAR);
    stopBtn.addEventListener("click", stopAR);
  </script>
</body>
</html>
